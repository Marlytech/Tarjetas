<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CAMBIA EL TÍTULO POR EL NOMBRE DEL NEGOCIO -->
    <title>Cafetería Roma | Redes y Contacto</title>
    <!-- Iconos de FontAwesome para las redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* PERSONALIZA LOS COLORES DEL NEGOCIO AQUÍ */
        :root {
            --bg-color: #121212;        /* Fondo de la pantalla */
            --card-bg: #1e1e1e;         /* Fondo de los botones */
            --text-color: #ffffff;      /* Color de texto principal */
            --subtext-color: #b3b3b3;   /* Color de descripción */
            --accent-color: #d4a373;    /* Color de marca del negocio */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin-bottom: 16px;
            background-color: #333;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        p.bio {
            font-size: 0.95rem;
            color: var(--subtext-color);
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .link-btn:active {
            transform: scale(0.97);
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 1.3rem;
        }

        /* Colores específicos por red */
        .whatsapp { border-left: 4px solid #25D366; }
        .whatsapp i { color: #25D366; }

        .instagram { border-left: 4px solid #E1306C; }
        .instagram i { color: #E1306C; }

        .facebook { border-left: 4px solid #1877F2; }
        .facebook i { color: #1877F2; }

        .tiktok { border-left: 4px solid #00f2fe; }
        .tiktok i { color: #00f2fe; }

        .maps { border-left: 4px solid #EA4335; }
        .maps i { color: #EA4335; }

        .menu { 
            background-color: var(--accent-color); 
            color: #121212; 
            border: none;
        }
        .menu i { color: #121212; }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.75rem;
            color: #666;
        }

        footer a {
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO DEL NEGOCIO (Puedes poner una imagen en la carpeta ej. logo.png) -->
        <img src="https://via.placeholder.com/150" alt="Logo del negocio" class="logo">

        <!-- NOMBRE Y DESCRIPCIÓN CORTA -->
        <h1>Cafetería Roma</h1>
        <p class="bio">Café de especialidad, pan artesanal y desayunos. ¡Síguenos o haz tu pedido!</p>

        <!-- BOTONES DE ENLACES (Borra los que el negocio no use) -->
        <div class="links-list">
            
            <!-- Botón destacado (Ej. Menú, Catálogo o Citas) -->
            <a href="https://tusitio.com/menu.pdf" target="_blank" class="link-btn menu">
                <i class="fa-solid fa-book-open"></i>
                Ver Menú / Catálogo
            </a>

            <!-- WhatsApp directo con mensaje prellenado (Cambia 521XXXXXXXXXX por su número) -->
            <a href="https://wa.me/5217221234567?text=Hola,%20vengo%20de%20escanear%20su%20tarjeta%20NFC" target="_blank" class="link-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                Pedir por WhatsApp
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/usuario" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                Instagram
            </a>

            <!-- Facebook -->
            <a href="https://facebook.com/usuario" target="_blank" class="link-btn facebook">
                <i class="fa-brands fa-facebook"></i>
                Facebook
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@usuario" target="_blank" class="link-btn tiktok">
                <i class="fa-brands fa-tiktok"></i>
                TikTok
            </a>

            <!-- Ubicación / Reseñas en Google Maps -->
            <a href="https://maps.google.com/?q=Ubicacion+del+negocio" target="_blank" class="link-btn maps">
                <i class="fa-solid fa-location-dot"></i>
                Cómo llegar / Déjanos una reseña
            </a>

        </div>

        <!-- TU MARCA COMO PROVEEDOR (Publicidad gratis en cada escaneo) -->
        <footer>
            Tarjeta digital creada por <a href="../index.html"><strong>TuMarca NFC</strong></a>
        </footer>
    </div>

</body>
</html>
